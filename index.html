<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>prompt archive</title>
<link rel="icon" id="favicon" href="">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<style>
:root{
  --cloud:#f6fbff; --pink:#cfe6ff; --pink-deep:#8fc4ff; --sky:#e4f2ff; --lilac:#e6e2ff;
  --gold:#fff0b3; --ink:#3f5473; --ink-soft:#7a8fae; --white:#ffffff;
  --accent:var(--pink-deep);
  --font:'Galmuri11','DungGeunMo',monospace;
  --lace:var(--ink);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:var(--font);font-size:13px;line-height:1.7;color:var(--ink);
  background:var(--cloud) fixed;
  background-image:linear-gradient(180deg,#d7ebff 0%,#eef7ff 45%,#f6fbff 100%);
  -webkit-font-smoothing:none;image-rendering:pixelated;
}
#bgLayer{position:fixed;inset:0;z-index:0;background-position:center;background-size:cover;pointer-events:none}
.rng{width:100%}
a{color:inherit}
button,input,textarea,select{font-family:var(--font);font-size:13px;color:var(--ink)}
button{cursor:inherit}
img{display:block;max-width:100%}
::selection{background:var(--lilac)}

/* pixel window primitives */
.win{background:var(--white);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--pink)}
.win-lilac{box-shadow:4px 4px 0 var(--lilac)}
.win-sky{box-shadow:4px 4px 0 var(--sky)}
.win-title{
  display:flex;align-items:center;gap:6px;padding:4px 8px;border-bottom:2px solid var(--ink);
  background:repeating-linear-gradient(90deg,var(--pink) 0 3px,var(--white) 3px 6px);
  font-size:12px;
}
.win-title .dots{margin-left:auto;display:flex;gap:4px}
.win-title .dots i{width:8px;height:8px;border:2px solid var(--ink);background:var(--white);display:block}
.win-title .dots i:nth-child(2){background:var(--sky)}
.win-title .dots i:nth-child(3){background:var(--pink)}

.btn{
  display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border:2px solid var(--ink);
  background:var(--white);box-shadow:2px 2px 0 var(--ink);line-height:1.5;white-space:nowrap;
}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.btn.p{background:var(--pink)}
.btn.s{background:var(--sky)}
.btn.l{background:var(--lilac)}
.btn.g{background:var(--gold)}
.btn.mini{padding:1px 6px;font-size:11px;box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{border-color:transparent;box-shadow:none;background:transparent;color:var(--ink-soft)}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px dashed var(--accent);outline-offset:2px}
input[type=text],input[type=url],textarea,select{
  width:100%;border:2px solid var(--ink);background:var(--white);padding:5px 8px;
}
textarea{resize:vertical;min-height:90px;line-height:1.6}
label.f{display:block;margin:8px 0 3px;font-size:12px;color:var(--ink-soft)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hidden{display:none!important}
.admin-only{display:none}
body.admin .admin-only{display:inherit}
body.admin .admin-only.btn,body.admin .admin-only.row{display:inline-flex}
body.admin .admin-only.row{display:flex}

/* layout */
.page{max-width:1120px;margin:0 auto;padding:22px 16px 80px;position:relative;z-index:2}
.banner{position:relative;margin-bottom:22px}
.banner .bg{height:210px;border:2px solid var(--ink);background:var(--pink) center/cover no-repeat;
  box-shadow:4px 4px 0 var(--lilac);position:relative;overflow:hidden}
.banner .bg::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:
   radial-gradient(circle at 12% 30%,rgba(255,255,255,.55) 0 2px,transparent 3px),
   radial-gradient(circle at 80% 22%,rgba(255,255,255,.6) 0 1.5px,transparent 2.5px),
   radial-gradient(circle at 60% 70%,rgba(255,255,255,.5) 0 2px,transparent 3px),
   radial-gradient(circle at 30% 80%,rgba(255,255,255,.5) 0 1.5px,transparent 2.5px);}
.banner .lace{height:10px;margin-top:-2px;
  background:radial-gradient(circle at 5px 0,var(--white) 0 5px,transparent 5.5px) 0 0/10px 10px repeat-x,
  radial-gradient(circle at 5px 0,var(--lace) 0 6px,transparent 6.5px) 0 0/10px 10px repeat-x;
  background-position:0 0,0 1px;}
.banner .copy{position:absolute;left:24px;bottom:34px;max-width:70%;
  background:rgba(255,255,255,.88);border:2px solid var(--ink);padding:10px 16px;box-shadow:3px 3px 0 var(--ink)}
.banner h1{font-size:22px;font-weight:normal;line-height:1.3;letter-spacing:0;word-break:keep-all}
.banner .sub{font-size:12px;color:var(--ink-soft);margin-top:4px;white-space:pre-wrap}
.banner .edit-b{position:absolute;right:10px;top:10px}
.stars{position:absolute;right:26px;top:22px;font-size:18px;color:var(--white);text-shadow:2px 2px 0 var(--ink);letter-spacing:6px;pointer-events:none}

.grid{display:grid;grid-template-columns:230px 1fr;gap:20px;align-items:start}
@media(max-width:760px){.grid{grid-template-columns:1fr}.banner .bg{max-height:180px}.banner .copy{left:12px;bottom:26px;max-width:85%}
 .side,main{display:contents}.side>.win{margin-bottom:0}
 #wProfile{order:1}#welcomeWin{order:2;margin-bottom:0!important}#tabs{order:3;margin:0}#toolbar{order:4;margin:0}#cards{order:5}
 #wPairs{order:6}#wSFolders{order:7}#wSTags{order:7}#wDiv{order:8;margin:0}#wPFolders{order:9}#wPTags{order:10}
 body[data-view=personas] .for-p,body[data-view=prompts] .for-s{display:none}}
/* 모바일 미리보기 (편집 모드) */
body.mobile .page{max-width:390px;border:2px solid var(--ink);box-shadow:6px 6px 0 var(--pink);background:var(--cloud);margin:20px auto 40px;padding:16px 12px 40px;border-radius:24px}
body.mobile .grid{grid-template-columns:1fr}body.mobile .side,body.mobile main{display:contents}body.mobile .side>.win{margin-bottom:0}
body.mobile #wProfile{order:1}body.mobile #welcomeWin{order:2;margin-bottom:0!important}body.mobile #tabs{order:3;margin:0}body.mobile #toolbar{order:4;margin:0}body.mobile #cards{order:5}
body.mobile #wPairs{order:6}body.mobile #wSFolders{order:7}body.mobile #wSTags{order:7}body.mobile #wDiv{order:8;margin:0}body.mobile #wPFolders{order:9}body.mobile #wPTags{order:10}
body.mobile[data-view=personas] .for-p,body.mobile[data-view=prompts] .for-s{display:none}
.folders li.on.s{background:var(--pink)}body.mobile .banner .bg{max-height:180px}body.mobile .banner .copy{left:12px;bottom:26px;max-width:85%}
body.mobile .savebar{margin:-16px -12px 16px;border-radius:22px 22px 0 0}
.savebar .btn.on,#w_alignRow .btn.on{background:var(--pink)}

.side>.win{margin-bottom:16px}
.pairs{padding:6px 10px 8px}
.pairbox{display:block;border:2px solid var(--ink);background:linear-gradient(180deg,#fff 0%,#f4f8ff 100%);padding:6px 10px;margin:10px 2px;text-align:center;cursor:pointer;
  --pc:#8fc4ff; box-shadow:0 0 8px 2px var(--pc); animation:glow 3s ease-in-out infinite; transition:transform .15s}
.pairbox:hover{transform:translateY(-1px);animation:none;box-shadow:0 0 14px 4px var(--pc)}
.pairbox.on{background:linear-gradient(180deg,#fff,var(--pc))}
@keyframes glow{0%,100%{box-shadow:0 0 6px 1px var(--pc)}50%{box-shadow:0 0 12px 4px var(--pc)}}
.show{grid-column:1/-1}
.show .duo{display:flex;align-items:center;justify-content:center;gap:18px;padding:22px 12px 14px;position:relative}
.show .duo::before{content:"";position:absolute;left:50%;top:50%;width:min(360px,90%);height:70%;transform:translate(-50%,-50%);background:var(--pc);opacity:.35;border-radius:50%;filter:blur(12px);z-index:0}
.show .who{position:relative;z-index:1;text-align:center}
.show .who img{width:120px;height:120px;object-fit:cover;border:2px solid var(--ink);background:var(--lilac);box-shadow:3px 3px 0 var(--pc)}
.show .who .nm{margin-top:6px;font-size:13px}
.show .who.link{cursor:pointer}.show .who.link:hover img{transform:translateY(-2px)}.show .who img{transition:transform .15s}
.show .who .go{display:inline-block;font-size:10px;border:2px solid var(--ink);background:var(--white);padding:0 4px;margin-left:3px;vertical-align:middle}
.show .heart{position:relative;z-index:1;font-size:22px;color:var(--pink-deep);text-shadow:2px 2px 0 var(--ink)}
.show .pn{text-align:center;font-size:15px;margin:2px 0 0}
.show .fr{text-align:center;font-size:11px;color:var(--ink-soft)}
.show .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);padding:8px 14px;margin:10px 0;border-top:2px dotted var(--pc);border-bottom:2px dotted var(--pc)}
.show .intro{margin:0 14px;border:2px solid var(--ink);background:var(--white);padding:12px 14px;white-space:pre-wrap;font-size:13px;line-height:1.8;position:relative}
.show .intro::before,.show .intro::after{content:"";position:absolute;left:0;right:0;height:6px;background:radial-gradient(circle at 3px 3px,var(--pc) 0 3px,transparent 3.5px) 0 0/6px 6px repeat-x}
.show .intro::before{top:-2px}.show .intro::after{bottom:-2px;background-position:0 3px}
.show .film{display:flex;gap:8px;overflow-x:auto;padding:14px 14px 10px;background:repeating-linear-gradient(90deg,var(--ink) 0 6px,transparent 6px 14px) top/100% 4px no-repeat,repeating-linear-gradient(90deg,var(--ink) 0 6px,transparent 6px 14px) bottom/100% 4px no-repeat}
.show .film img{height:130px;width:auto;flex:0 0 auto;border:2px solid var(--ink);cursor:zoom-in}
.show .memo{font-size:11px;color:var(--ink-soft);padding:8px 14px 12px;text-align:center}
.pal{display:flex;gap:6px;flex-wrap:wrap}.pal i{width:22px;height:22px;border:2px solid var(--ink);display:block;cursor:pointer}.pal i.on{outline:2px dashed var(--ink);outline-offset:2px}
.divider{display:flex;align-items:center;gap:8px;margin:2px 0 18px;color:var(--pink-deep);font-size:11px}
.divider::before,.divider::after{content:"";flex:1;height:0;border-top:2px dotted var(--pink-deep)}
.profile .body{padding:12px;text-align:center}
.profile .avatar{width:96px;height:96px;margin:0 auto 8px;border:2px solid var(--ink);object-fit:cover;background:var(--sky);box-shadow:2px 2px 0 var(--pink)}
.profile .name{font-size:15px}
.profile .bio{font-size:12px;color:var(--ink-soft);white-space:pre-wrap;margin-top:4px;text-align:left}
.profile .links{margin-top:10px;display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.profile .links .btn{background:var(--sky);text-decoration:none}
.profile .links .btn::before{content:'✧ ';color:var(--pink-deep)}
.folders ul{list-style:none;padding:8px}
.folders li{display:flex;align-items:center;gap:6px;padding:4px 6px;border:2px solid transparent}
.folders li:hover{border-color:var(--lilac)}
.folders li.on{background:var(--lilac);border-color:var(--ink)}
.folders li .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folders li .c{font-size:11px;color:var(--ink-soft)}
.folders .add{padding:0 8px 8px}
.tagcloud{padding:8px;display:flex;flex-wrap:wrap;gap:4px}
.tag{display:inline-block;padding:0 6px;border:2px solid var(--ink);background:var(--sky);font-size:11px;line-height:1.6;white-space:nowrap}
.tag.on{background:var(--pink)}
.tag:hover{background:var(--gold)}

.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.toolbar input{flex:1;min-width:160px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{display:flex;flex-direction:column;position:relative}
.card .thumb{aspect-ratio:1/1;background:var(--lilac);border-bottom:2px solid var(--ink);overflow:hidden;position:relative}
.card .thumb img{width:100%;height:100%;object-fit:cover}
.card .thumb .cnt{position:absolute;right:6px;bottom:6px;background:var(--white);border:2px solid var(--ink);font-size:11px;padding:0 5px}
.card .thumb .empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink-soft);font-size:12px}
.card .body{padding:8px 10px 10px}
.card .t{font-size:14px;margin-bottom:2px;word-break:break-all}
.card .pv{font-size:11px;color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.card .tags{margin-top:6px;display:flex;flex-wrap:wrap;gap:3px}
.card .acts{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.empty-state{padding:36px 12px;text-align:center;color:var(--ink-soft)}
.welcome .body{padding:16px 20px;text-align:left}
.welcome .wimg{max-width:100%;object-fit:cover;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--sky)}
.welcome .wt{white-space:pre-wrap;text-align:left;font-size:13px;line-height:1.8}
.welcome .lace2{height:8px;background:radial-gradient(circle at 4px 8px,var(--sky) 0 4px,transparent 4.5px) 0 0/8px 8px repeat-x}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs .btn.on{background:var(--pink)}
.card .dd{position:absolute;left:6px;top:6px;background:var(--white);border:2px solid var(--ink);font-size:11px;padding:0 6px;z-index:1}
.card .ord{position:absolute;right:6px;top:6px;display:flex;gap:3px;z-index:1}
.persona-list{list-style:none;padding:8px}
.persona-list li{display:flex;align-items:center;gap:8px;padding:4px 6px;border:2px solid transparent;cursor:pointer}
.persona-list li:hover{border-color:var(--lilac)}
.persona-list li.on{background:var(--pink);border-color:var(--ink)}
.persona-list img{width:26px;height:26px;border:2px solid var(--ink);object-fit:cover;background:var(--lilac)}
.persona-list .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.persona-list .d{font-size:11px;color:var(--ink-soft)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(90,61,85,.35);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .win{width:min(760px,100%);max-height:92vh;overflow:auto}
.modal.panel{justify-content:flex-end;background:transparent;pointer-events:none;align-items:stretch}
.modal.panel .win{pointer-events:auto;width:min(420px,100%);max-height:none;box-shadow:-4px 0 0 var(--pink)}
.modal .body{padding:14px}
.detail .imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.detail .imgs .im{position:relative;border:2px solid var(--ink);background:var(--lilac)}
.detail .imgs img{width:100%;aspect-ratio:1/1;object-fit:cover}
.detail .imgs .del{position:absolute;top:2px;right:2px}
.detail .imgs .view{cursor:zoom-in}
.pbox{position:relative;border:2px solid var(--ink);background:var(--cloud);padding:10px 12px;white-space:pre-wrap;word-break:break-all;line-height:1.6;margin-top:6px}
.pbox .cp{position:absolute;right:6px;top:6px}
.pbox.neg{background:#eef0ff}
.h{font-size:12px;color:var(--ink-soft);margin-top:10px}
.lightbox{position:fixed;inset:0;background:rgba(40,20,40,.85);display:flex;align-items:center;justify-content:center;z-index:60;cursor:zoom-out}
.lightbox img{max-width:96vw;max-height:96vh;border:2px solid var(--white)}
.tagbox{display:flex;flex-wrap:wrap;gap:4px;align-items:center;border:2px solid var(--ink);background:var(--white);padding:4px 6px;cursor:text}
.tagbox input{border:0;flex:1;min-width:90px;padding:2px}
.tagbox .tag b{font-weight:normal;cursor:pointer;margin-left:2px}
.sugg{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}.sugg .tag{cursor:pointer;opacity:.85}.sugg .tag.used{opacity:.35}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches i{width:22px;height:22px;border:2px solid var(--ink);display:block;cursor:pointer}
.swatches i.on{outline:2px dashed var(--ink);outline-offset:2px}
.prev{width:56px;height:56px;border:2px solid var(--ink);object-fit:cover;background:var(--lilac)}
.dropzone{border:2px dashed var(--ink);padding:14px;text-align:center;color:var(--ink-soft);background:var(--white)}
.dropzone.over{background:var(--sky)}
.status{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:70;
  border:2px solid var(--ink);background:var(--gold);padding:6px 14px;box-shadow:3px 3px 0 var(--ink);display:none}
.status.show{display:block}
#fx{position:fixed;inset:0;pointer-events:none;z-index:20}
.keybtn{position:fixed;right:12px;bottom:12px;z-index:40;background:var(--white)}
body.admin .keybtn{display:none}
.savebar{position:sticky;top:0;z-index:30;margin:-22px -16px 16px;padding:8px 16px;background:var(--gold);border-bottom:2px solid var(--ink);display:none;gap:8px;align-items:center;flex-wrap:wrap}
body.admin .savebar{display:flex}
.savebar .dirty{margin-left:auto;font-size:12px}
.chk{display:flex;align-items:center;gap:6px;margin:6px 0}
@media (prefers-reduced-motion:reduce){#fx{display:none}}
</style>
</head>
<body>
<div id="bgLayer"></div>
<canvas id="fx"></canvas>

<div class="page">
  <div class="savebar">
    <span>편집 모드</span>
    <button class="btn p" onclick="openPromptEditor()">+ 프롬프트</button>
    <button class="btn p" onclick="openPersonaEditor()">+ 페르소나</button>
    <button class="btn p" onclick="openPairEditor()">+ 페어</button>
    <button class="btn l" onclick="openSiteEditor()">사이트 설정</button>
    <button class="btn s" onclick="openSetup()">연결 설정</button>
    <span class="row" style="gap:0"><button class="btn mini on" id="devPC" onclick="setDevice(false)">PC</button><button class="btn mini" id="devMO" onclick="setDevice(true)">모바일</button></span>
    <button class="btn mini" onclick="exportJson()">JSON 내보내기</button><button class="btn mini" onclick="$('#jsonIn').click()">JSON 불러오기</button><input type="file" id="jsonIn" accept=".json,application/json" class="hidden" onchange="importJson(this.files[0]);this.value=''">
    <span class="dirty" id="dirty">사이트 반영됨</span><span id="quota" style="font-size:11px;color:var(--ink-soft)"></span>
    <button class="btn" onclick="saveLocal()">저장</button>
    <button class="btn g" id="saveBtn" onclick="publish()">지금 다시 올리기</button>
    <button class="btn mini" onclick="$('#siteIn').click()" title="새 index.html로 사이트 교체">사이트 파일 교체</button><input type="file" id="siteIn" accept=".html,text/html" class="hidden" onchange="replaceSite(this.files[0]);this.value=''">
    <button class="btn ghost" onclick="exitAdmin()">나가기</button>
  </div>

  <div class="banner">
    <div class="bg" id="bannerBg"></div>
    <div class="lace"></div>
    <div class="stars">✧ ˚ ✧</div>
    <div class="copy">
      <h1 id="bannerTitle"></h1>
      <div class="sub" id="bannerSub"></div>
    </div>
    <button class="btn mini admin-only edit-b" onclick="openSiteEditor()">대문 편집</button>
  </div>

  <div class="grid">
    <aside class="side">
      <div class="win profile" id="wProfile">
        <div class="win-title">profile<span class="dots"><i></i><i></i><i></i></span></div>
        <div class="body">
          <img class="avatar" id="pAvatar" alt="">
          <div class="name" id="pName"></div>
          <div class="bio" id="pBio"></div>
          <div class="links" id="pLinks"></div>
        </div>
      </div>
      <div class="win folders for-s" id="wSFolders">
        <div class="win-title">persona<span class="dots"><i></i><i></i><i></i></span></div>
        <ul id="sFolderList"></ul>
        <div class="add admin-only"><button class="btn mini p" onclick="addFolder('s')">+ 폴더</button></div>
      </div>
      <div class="win win-lilac for-s" id="wSTags">
        <div class="win-title">persona tags<span class="dots"><i></i><i></i><i></i></span></div>
        <div class="tagcloud" id="sTagCloud"></div>
      </div>
      <div class="win" id="wPairs" style="box-shadow:4px 4px 0 var(--pink)">
        <div class="win-title">u×u<span class="dots"><i></i><i></i><i></i></span></div>
        <div class="pairs" id="pairList"></div>
        <div class="add admin-only" style="padding:0 10px 8px"><button class="btn mini p" onclick="openPairEditor()">+ 페어</button></div>
      </div>
      <div class="divider for-p" id="wDiv"><span>✧</span></div>
      <div class="win win-sky folders for-p" id="wPFolders">
        <div class="win-title">prompt<span class="dots"><i></i><i></i><i></i></span></div>
        <ul id="pFolderList"></ul>
        <div class="add admin-only"><button class="btn mini s" onclick="addFolder('p')">+ 폴더</button></div>
      </div>
      <div class="win win-lilac for-p" id="wPTags">
        <div class="win-title">prompt tags<span class="dots"><i></i><i></i><i></i></span></div>
        <div class="tagcloud" id="pTagCloud"></div>
      </div>
    </aside>

    <main>
      <div class="win welcome" id="welcomeWin" style="margin-bottom:16px">
        <div class="win-title"><span id="wTitle"></span><span class="dots"><i></i><i></i><i></i></span></div>
        <div class="lace2"></div>
        <div class="body"><img class="wimg" id="wImg" alt=""><div class="wt" id="wText"></div>
          <div class="row admin-only" style="justify-content:center;margin-top:10px"><button class="btn mini l" onclick="openSiteEditor()">이 창 편집</button></div></div>
      </div>
      <div class="tabs" id="tabs"><button class="btn on" id="tabS" onclick="setView('personas')">♡ 페르소나</button><button class="btn" id="tabP" onclick="setView('prompts')">☁ 프롬프트</button></div>
      <div class="toolbar" id="toolbar">
        <input type="text" id="q" placeholder="검색 (제목/프롬프트/태그)" oninput="render()">
        <select id="sort" onchange="render()" style="width:auto">
          <option value="manual">내 순서</option><option value="new">최신순</option>
          <option value="old">오래된순</option>
          <option value="name">이름순</option><option value="dday">디데이순</option>
        </select>
      </div>
      <div class="cards" id="cards"></div>
    </main>
  </div>
</div>

<button class="btn mini keybtn" onclick="enterAdmin()">⚿ 편집</button>
<div class="status" id="status"></div>
<div id="modalRoot"></div>

<script>
/* ---------- state ---------- */
const DEFAULT = {
  site:{
    title:'prompt archive ✧', sub:'대문 문구는 편집 모드에서 바꿀 수 있어요',
    banner:'', bannerShadowOn:true, bannerShadowColor:'', bannerH:210, bannerOp:1, bannerPos:50, bg:'', bgOp:1, bgSize:'cover', bgColor:'', laceOn:true, laceColor:'', accent:'#8fc4ff', favicon:'☁', faviconImg:'', cursor:'', cursorSize:32, cursorHot:'tl', effect:'none', fx:{density:1},
    profile:{name:'이름', bio:'한 줄 소개', img:'', links:[]},
    welcome:{on:true,title:'welcome ✧',text:'소개글을 넣어주세요.',img:''}
  },
  folders:[{id:'f1',name:'기본'}], pfolders:[{id:'pf1',name:'기본'}],
  prompts:[], personas:[], pairs:[]
};
let data = structuredClone(DEFAULT);
let cfg = JSON.parse(localStorage.getItem('pa_cfg')||'null');   // {owner,repo,branch,token}
let curFolder='all', curPFolder='all', curTag=null, curPersona=null, curPair=null, view='personas', dirty=false;
// 임시저장은 IndexedDB (localStorage는 5MB 제한이라 사진 넣으면 터짐)
const idb={db:null,open(){return new Promise(r=>{const q=indexedDB.open('pa',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{this.db=q.result;r();};q.onerror=()=>r();});},
  get(k){return new Promise(r=>{if(!this.db)return r(null);const t=this.db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>r(t.result);t.onerror=()=>r(null);});},
  set(k,v){return new Promise(r=>{if(!this.db)return r();const t=this.db.transaction('kv','readwrite').objectStore('kv').put(v,k);t.onsuccess=()=>r();t.onerror=()=>r();});},
  del(k){return new Promise(r=>{if(!this.db)return r();const t=this.db.transaction('kv','readwrite').objectStore('kv').delete(k);t.onsuccess=()=>r();t.onerror=()=>r();});}};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const $=s=>document.querySelector(s);

/* ---------- load ---------- */
async function load(){
  await idb.open();
  if(navigator.storage?.persist) navigator.storage.persist(); // 브라우저가 임시저장을 함부로 지우지 않게
  showQuota();
  try{
    const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});
    if(r.ok){ data=Object.assign(structuredClone(DEFAULT),await r.json()); }
  }catch(e){}
  const d=await idb.get('draft'); // 아직 사이트에 반영 안 된 로컬 저장분
  if(d && d.savedAt>(data.savedAt||0)){ data=d; dirty=true; editVer++; $('#dirty').textContent='사이트 반영 안 됨'; setTimeout(autoPublish,500); }
  data.personas=data.personas||[]; data.pairs=data.pairs||[]; data.site.welcome=data.site.welcome||structuredClone(DEFAULT.site.welcome); data.pfolders=data.pfolders?.length?data.pfolders:[{id:'pf1',name:'기본'}]; data.personas.forEach(x=>{if(!data.pfolders.find(f=>f.id===x.folder))x.folder=data.pfolders[0].id;});
  applySite(); render();
}
let editVer=0, pubTimer=null, publishing=false, pubAgain=false;
function setDirty(v){ dirty=v; showQuota(); $('#dirty').textContent=v?(cfg?.token?'올리는 중…':'사이트 반영 안 됨'):'사이트 반영됨 ✧';
  if(v){ editVer++; data.savedAt=Date.now(); idb.set('draft',JSON.parse(JSON.stringify(data))); autoPublish(); } }
// 연결돼 있으면 고칠 때마다 자동으로 사이트에 올림 (연달아 고치면 1.5초 모아서 한 번에)
function autoPublish(){ if(!cfg?.token)return; clearTimeout(pubTimer); pubTimer=setTimeout(runPublish,1500); }
async function runPublish(){ if(publishing){pubAgain=true;return;} publishing=true; await publish(true); publishing=false; if(pubAgain){pubAgain=false;runPublish();} }
async function showQuota(){ if(!navigator.storage?.estimate)return; const e=await navigator.storage.estimate(); const mb=x=>(x/1048576).toFixed(0); $('#quota').textContent=`로컬 ${mb(e.usage)}MB / ${mb(e.quota)}MB`; }
async function saveLocal(){ data.savedAt=Date.now(); await idb.set('draft',JSON.parse(JSON.stringify(data))); toast('저장되었습니다 ✧ (이 브라우저에)',2200); }

/* ---------- site apply ---------- */
function applySite(s){
  s=s||data.site;
  document.title=s.title.replace(/[✧˚]/g,'').trim()||'prompt archive';
  $('#favicon').href=s.faviconImg||('data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><text x="32" y="52" font-size="52" text-anchor="middle">${s.favicon||'☁'}</text></svg>`));
  $('#bannerTitle').textContent=s.title; $('#bannerSub').textContent=s.sub;
  const bb=$('#bannerBg'); bb.style.backgroundImage=s.banner?`url(${s.banner})`:''; bb.style.height=(s.bannerH||210)+'px'; bb.style.opacity=s.bannerOp??1; bb.style.backgroundPosition=`center ${s.bannerPos??50}%`; bb.style.boxShadow=s.bannerShadowOn===false?'none':`4px 4px 0 ${s.bannerShadowColor||'var(--lilac)'}`;
  const lace=document.querySelector('.banner .lace'); lace.style.display=s.laceOn===false?'none':''; document.documentElement.style.setProperty('--lace',s.laceColor||'var(--ink)');
  document.documentElement.style.setProperty('--accent',s.accent||'#8fc4ff');
  document.documentElement.style.setProperty('--pink',s.accent?tint(s.accent):'#cfe6ff');
  const bl=$('#bgLayer'); bl.style.backgroundImage=s.bg?`url(${s.bg})`:''; bl.style.opacity=s.bgOp??1; bl.style.backgroundSize=s.bgSize==='repeat'?'auto':(s.bgSize||'cover'); bl.style.backgroundRepeat=s.bgSize==='repeat'?'repeat':'no-repeat';
  document.body.style.backgroundImage=s.bgColor?'none':''; document.body.style.backgroundColor=s.bgColor||'';
  const cs=s.cursorSize||32, hot=s.cursorHot==='c'?`${cs>>1} ${cs>>1}`:'2 2'; document.body.style.cursor=s.cursor?`url(${s.cursor}) ${hot}, auto`:'';
  const p=s.profile;
  $('#pAvatar').src=p.img||'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><rect width="16" height="16" fill="#cfe6ff"/><path d="M5 6h1v1H5zM10 6h1v1h-1zM6 10h4v1H6z" fill="#3f5473"/></svg>');
  $('#pName').textContent=p.name; $('#pBio').textContent=p.bio;
  $('#pLinks').innerHTML=(p.links||[]).map(l=>`<a class="btn mini" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join('');
  const w=s.welcome||{}; $('#welcomeWin').classList.toggle('hidden',!w.on);
  $('#wTitle').textContent=w.title||''; $('#wText').textContent=w.text||''; const wi=$('#wImg'); wi.src=w.img||''; wi.classList.toggle('hidden',!w.img); const al=w.align||'left'; wi.style.maxHeight=al==='wide'?'none':(w.imgH||260)+'px'; wi.style.width=al==='wide'?'100%':'auto'; wi.style.margin=al==='center'?'0 auto 12px':al==='right'?'0 0 12px auto':'0 0 12px';
  startFx(s.effect,s.fx);
}
function tint(hex){ const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255; const m=x=>Math.round(x+(255-x)*.55); return `rgb(${m(r)},${m(g)},${m(b)})`; }
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ---------- render ---------- */
function setView(v,keepTag){ if(view!==v){curTag=null;curPersona=null;} view=v; if(v!=='pair')curPair=null; if(!keepTag){curTag=null;} $('#tabP').classList.toggle('on',v==='prompts'); $('#tabS').classList.toggle('on',v==='personas'); $('#toolbar').classList.toggle('hidden',v==='pair'); render(); }
function openPair(id){ curPair=id; setView('pair'); }
function dday(d){ if(!d)return ''; const t=new Date(); t.setHours(0,0,0,0); const n=Math.round((t-new Date(d+'T00:00:00'))/864e5); return n>=0?`D+${n+1}`:`D${n}`; }
function byOrder(a,b){ return (a.order??0)-(b.order??0); }
function moveItem(kind,id,dir){ const arr=kind==='p'?data.prompts:data.personas; arr.sort(byOrder).forEach((x,i)=>x.order=i); const i=arr.findIndex(x=>x.id===id); const j=i+dir; if(j<0||j>=arr.length)return; [arr[i].order,arr[j].order]=[arr[j].order,arr[i].order]; setDirty(true); render(); }
function render(){
  const isAdmin=document.body.classList.contains('admin');
  const q=$('#q').value.trim().toLowerCase(), sort=$('#sort').value;
  const sorter=(a,b)=>sort==='name'?a.title.localeCompare(b.title):sort==='old'?a.created-b.created:sort==='new'?b.created-a.created:sort==='dday'?(new Date(a.dday||0)-new Date(b.dday||0)):byOrder(a,b);
  const ordBtns=(k,id)=>isAdmin&&sort==='manual'?`<span class="ord"><button class="btn mini" onclick="event.stopPropagation();moveItem('${k}','${id}',-1)">◀</button><button class="btn mini" onclick="event.stopPropagation();moveItem('${k}','${id}',1)">▶</button></span>`:'';
  document.body.dataset.view=view;
  const folderHtml=(kind,folders,items,cur,cls)=>{ const counts={}; items.forEach(p=>counts[p.folder]=(counts[p.folder]||0)+1); const v=kind==='p'?'prompts':'personas';
    return [`<li class="${cur==='all'?'on '+cls:''}" onclick="setView('${v}');selFolder('${kind}','all')"><span class="n">☁ 전체</span><span class="c">${items.length}</span></li>`]
    .concat(folders.map(f=>`<li class="${cur===f.id?'on '+cls:''}" onclick="setView('${v}');selFolder('${kind}','${f.id}')"><span class="n">▸ ${esc(f.name)}</span><span class="c">${counts[f.id]||0}</span>
      <span class="admin-only"><button class="btn mini" onclick="event.stopPropagation();renameFolder('${kind}','${f.id}')">✎</button> <button class="btn mini" onclick="event.stopPropagation();delFolder('${kind}','${f.id}')">✕</button></span></li>`)).join(''); };
  $('#pFolderList').innerHTML=folderHtml('p',data.folders,data.prompts,curFolder,'');
  $('#sFolderList').innerHTML=folderHtml('s',data.pfolders,data.personas,curPFolder,'s');
  const tagHtml=(items,v)=>{ const tc={}; items.forEach(p=>(p.tags||[]).forEach(t=>tc[t]=(tc[t]||0)+1));
    return Object.keys(tc).sort().map(t=>`<span class="tag ${view===v&&curTag===t?'on':''}" onclick="setView('${v}',true);selTag('${esc(t)}')">${esc(t)} ${tc[t]}</span>`).join('')||'<span style="font-size:11px;color:var(--ink-soft)">태그 없음</span>'; };
  $('#pTagCloud').innerHTML=tagHtml(data.prompts,'prompts'); $('#sTagCloud').innerHTML=tagHtml(data.personas,'personas');
  $('#pairList').innerHTML=data.pairs.slice().sort(byOrder).map(x=>`<div class="pairbox ${curPair===x.id?'on':''}" style="--pc:${x.color||'#8fc4ff'}99" onclick="openPair('${x.id}')">${esc(pairA(x).name)} × ${esc(x.nameB)}</div>`).join('')||'<div style="font-size:11px;color:var(--ink-soft);text-align:center;padding:4px">아직 없음</div>';
  if(view==='pair'){ const x=data.pairs.find(p=>p.id===curPair); if(!x){setView('personas');return;}
    const fmt=d=>d?d.replace(/-/g,'.'):''; const A=pairA(x);
    $('#cards').innerHTML=`<div class="win show" style="--pc:${x.color||'#8fc4ff'};box-shadow:4px 4px 0 ${x.color||'#8fc4ff'}">
      <div class="win-title">${esc(x.pairName||A.name+' × '+x.nameB)}<span class="row" style="margin-left:auto;gap:4px"><button class="btn mini admin-only l" onclick="openPairEditor('${x.id}')">편집</button><span class="dots"><i></i><i></i><i></i></span></span></div>
      <div class="duo"><div class="who ${A.pid?'link':''}" ${A.pid?`onclick="openPersona('${A.pid}')" title="프롬 보기"`:''}><img src="${esc(A.img)}" alt=""><div class="nm">${esc(A.name)}${A.pid?' <span class="go">✧ 프롬</span>':''}</div></div><div class="heart">♡</div><div class="who"><img src="${esc(x.imgB||'')}" alt=""><div class="nm">${esc(x.nameB)}</div></div></div>
      ${x.pairName?`<div class="pn">${esc(x.pairName)}</div>`:''}${x.friend?`<div class="fr">with ${esc(x.friend)}</div>`:''}
      <div class="meta"><span>${x.rel?'♡ '+esc(x.rel):''}</span><span>${x.start?'since '+fmt(x.start):''}</span></div>
      ${x.intro?`<div class="intro">${esc(x.intro)}</div>`:''}
      ${x.photos?.length?`<div class="film" style="margin-top:14px">${x.photos.map(u=>`<img src="${esc(u)}" onclick="lightbox('${esc(u)}')" alt="">`).join('')}</div>`:''}
      ${x.memo?`<div class="memo">${esc(x.memo)}</div>`:'<div style="height:10px"></div>'}
    </div>`; return; }

  if(view==='prompts'){
    let list=data.prompts.filter(p=>(curFolder==='all'||p.folder===curFolder)&&(!curTag||(p.tags||[]).includes(curTag))
      &&(!q||[p.title,p.prompt,p.neg,(p.tags||[]).join(' ')].join(' ').toLowerCase().includes(q))).sort(sorter);
    $('#cards').innerHTML=list.length?list.map(p=>`<div class="card win">${ordBtns('p',p.id)}
      <div class="thumb" onclick="openDetail('${p.id}')">${p.images?.length?`<img src="${esc(p.images[0])}" alt="">${p.images.length>1?`<span class="cnt">+${p.images.length-1}</span>`:''}`:`<div class="empty">no image</div>`}</div>
      <div class="body">
        <div class="t">${esc(p.title)}</div>
        <div class="pv">${esc(p.prompt)}</div>
        <div class="tags">${(p.tags||[]).map(t=>`<span class="tag" onclick="selTag('${esc(t)}')">${esc(t)}</span>`).join('')}</div>
        <div class="acts"><button class="btn mini p" onclick="copyText(${JSON.stringify(p.prompt).replace(/"/g,'&quot;')},this)">복사</button>
          <button class="btn mini" onclick="openDetail('${p.id}')">보기</button>
          <button class="btn mini admin-only l" onclick="openPromptEditor('${p.id}')">편집</button></div>
      </div></div>`).join(''):`<div class="empty-state win" style="grid-column:1/-1">아직 프롬프트가 없어요${isAdmin?'. 위의 + 프롬프트로 추가':''}</div>`;
  } else {
    let list=data.personas.filter(x=>(curPFolder==='all'||x.folder===curPFolder)&&(!curPersona||x.id===curPersona)&&(!curTag||(x.tags||[]).includes(curTag))
      &&(!q||[x.name,x.intro,x.rel,x.prompt,x.outfit,(x.tags||[]).join(' ')].join(' ').toLowerCase().includes(q)))
      .map(x=>({...x,title:x.name})).sort(sorter);
    $('#cards').innerHTML=(curPersona?`<div style="grid-column:1/-1"><button class="btn mini" onclick="curPersona=null;render()">◀ 전체 보기</button></div>`:'')+(list.length?list.map(x=>`<div class="card win win-sky">${ordBtns('s',x.id)}
      ${x.dday?`<span class="dd">${dday(x.dday)}</span>`:''}
      <div class="thumb" onclick="openPersona('${x.id}')">${x.images?.length?`<img src="${esc(x.images[0])}" alt="">${x.images.length>1?`<span class="cnt">+${x.images.length-1}</span>`:''}`:`<div class="empty">no image</div>`}</div>
      <div class="body">
        <div class="t">${esc(x.name)}${x.rel?` <span style="font-size:11px;color:var(--ink-soft)">· ${esc(x.rel)}</span>`:''}</div>
        <div class="pv">${esc(x.intro||x.prompt)}</div>
        <div class="tags">${(x.tags||[]).map(t=>`<span class="tag" onclick="selTag('${esc(t)}')">${esc(t)}</span>`).join('')}</div>
        <div class="acts"><button class="btn mini p" onclick="copyText(${JSON.stringify(x.prompt).replace(/"/g,'&quot;')},this)">프롬</button>
          ${x.outfit?`<button class="btn mini s" onclick="copyText(${JSON.stringify(x.outfit).replace(/"/g,'&quot;')},this)">옷</button><button class="btn mini l" onclick="copyText(${JSON.stringify(x.prompt+', '+x.outfit).replace(/"/g,'&quot;')},this)">같이</button>`:''}
          <button class="btn mini" onclick="openPersona('${x.id}')">보기</button>
          <button class="btn mini admin-only l" onclick="openPersonaEditor('${x.id}')">편집</button></div>
      </div></div>`).join(''):`<div class="empty-state win" style="grid-column:1/-1">아직 페르소나가 없어요${isAdmin?'. + 페르소나로 추가':''}</div>`);
  }
}
function selFolder(kind,id){ if(kind==='p')curFolder=id; else curPFolder=id; curPersona=null; render(); }
function selTag(t){curTag=curTag===t?null:t;render();}
async function copyText(t,btn){ try{await navigator.clipboard.writeText(t);}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
  if(btn){const o=btn.textContent;btn.textContent='복사됨 ✧';setTimeout(()=>btn.textContent=o,1200);} else toast('복사됨 ✧'); }
function toast(m,ms=1800){const s=$('#status');s.textContent=m;s.classList.add('show');clearTimeout(s._t);s._t=setTimeout(()=>s.classList.remove('show'),ms);}

/* ---------- modals ---------- */
function modal(html,cls=''){ $('#modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="win ${cls}">${html}</div></div>`; }
function closeModal(){ const wasSite=!!$('#s_title'); $('#modalRoot').innerHTML=''; if(wasSite)applySite(); else startFx(data.site.effect,data.site.fx);}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();$('#lb')?.remove();}});

function openDetail(id){
  const p=data.prompts.find(x=>x.id===id); if(!p)return;
  const f=data.folders.find(x=>x.id===p.folder);
  modal(`<div class="win-title">${esc(p.title)}<span class="dots"><i></i><i></i><i></i></span></div>
  <div class="body detail">
    ${p.images?.length?`<div class="imgs">${p.images.map(u=>`<div class="im"><img class="view" src="${esc(u)}" onclick="lightbox('${esc(u)}')" alt=""></div>`).join('')}</div>`:''}
    <div class="row" style="justify-content:space-between"><span style="font-size:12px;color:var(--ink-soft)">▸ ${esc(f?.name||'')}</span>
      <span class="row"><button class="btn mini admin-only l" onclick="openPromptEditor('${p.id}')">편집</button><button class="btn mini" onclick="closeModal()">닫기</button></span></div>
    <div class="h">prompt</div>
    <div class="pbox">${esc(p.prompt)}<button class="btn mini p cp" onclick="copyText(${JSON.stringify(p.prompt).replace(/"/g,'&quot;')},this)">복사</button></div>
    ${p.neg?`<div class="h">negative</div><div class="pbox neg">${esc(p.neg)}<button class="btn mini cp" onclick="copyText(${JSON.stringify(p.neg).replace(/"/g,'&quot;')},this)">복사</button></div>`:''}
    ${p.note?`<div class="h">memo</div><div style="white-space:pre-wrap;font-size:12px">${esc(p.note)}</div>`:''}
    <div class="tags" style="margin-top:10px;display:flex;flex-wrap:wrap;gap:3px">${(p.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
  </div>`);
}
function lightbox(u){const d=document.createElement('div');d.className='lightbox';d.id='lb';d.innerHTML=`<img src="${u}">`;d.onclick=()=>d.remove();document.body.appendChild(d);}

/* ---------- persona ---------- */
function openPersona(id){
  const x=data.personas.find(p=>p.id===id); if(!x)return;
  const cp=t=>`onclick="copyText(${JSON.stringify(t).replace(/"/g,'&quot;')},this)"`;
  modal(`<div class="win-title">${esc(x.name)}${x.dday?` <span class="tag">${dday(x.dday)}</span>`:''}<span class="dots"><i></i><i></i><i></i></span></div>
  <div class="body detail">
    ${x.images?.length?`<div class="imgs">${x.images.map(u=>`<div class="im"><img class="view" src="${esc(u)}" onclick="lightbox('${esc(u)}')" alt=""></div>`).join('')}</div>`:''}
    <div class="row" style="justify-content:space-between"><span style="font-size:12px;color:var(--ink-soft)">${x.rel?'♡ '+esc(x.rel):''}${x.dday?'　'+esc(x.dday)+'부터':''}</span>
      <span class="row"><button class="btn mini admin-only l" onclick="openPersonaEditor('${x.id}')">편집</button><button class="btn mini" onclick="closeModal()">닫기</button></span></div>

// 메타데이터 제거: 캔버스에 흰 배경으로 다시 그려서 재인코딩 (EXIF/tEXt/알파채널 숨김정보 모두 삭제)
function stripMeta(file,max=2048){
  if(file.type==='image/gif'){ file.ext='gif'; return Promise.resolve(file); } // gif는 움직임 유지 (메타데이터 없음)
  return new Promise(res=>{ const img=new Image(); img.onload=()=>{
    let w=img.width,h=img.height; if(Math.max(w,h)>max){const k=max/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k);}
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
    c.toBlob(b=>{ if(b.size>2.5e6){c.toBlob(b2=>{b2.ext='jpg';res(b2);},'image/jpeg',.9);} else {b.ext='png';res(b);} },'image/png');
    URL.revokeObjectURL(img.src); }; img.src=URL.createObjectURL(file); });
}

const tmpImgs={};
function pickImg(key,max,isCursor){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=async()=>{const f=inp.files[0];if(!f)return;toast('올리는 중…',9000);
    const blob=isCursor?await cursorBlob(f):await stripMeta(f,max);
    const path=await uploadFile(blob,'assets/'+key+'-'+uid()+'.'+blob.ext);
    if(path){tmpImgs[key]=path;$('#s_'+key+'P').src=path;toast('올라감');previewSite();}};
  inp.click();
}
function clearImg(key){tmpImgs[key]='';$('#s_'+key+'P').src='';previewSite();}
function cursorBlob(file){ const size=+($('#s_cursorSize')?.value||32); return new Promise(res=>{const img=new Image();img.onload=()=>{
  const c=document.createElement('canvas');c.width=size;c.height=size;const x=c.getContext('2d');
  const k=Math.min(size/img.width,size/img.height); const w=Math.max(1,Math.round(img.width*k)),h=Math.max(1,Math.round(img.height*k));
  // 작은 픽셀 이미지를 키울 땐 또렷하게, 큰 사진을 줄일 땐 부드럽게 (안 그러면 깨져 보임)
  x.imageSmoothingEnabled=k<1; x.imageSmoothingQuality='high';
  if(k<1&&img.width>size*3){ // 큰 이미지는 두 단계로 줄여야 덜 깨짐
    const t=document.createElement('canvas');t.width=Math.round(img.width/2);t.height=Math.round(img.height/2);const tx=t.getContext('2d');tx.imageSmoothingQuality='high';tx.drawImage(img,0,0,t.width,t.height);x.drawImage(t,0,0,w,h);
  } else x.drawImage(img,0,0,w,h);
  c.toBlob(b=>{b.ext='png';res(b);},'image/png');};img.src=URL.createObjectURL(file);}); }
function collectSite(){

    return {label:r.querySelector('.ll').value.trim()||guessLinkName(b),url:b}; }).filter(Boolean);
}

function guessLinkName(u){ let a='link'; try{a=new URL(/^https?:/i.test(u)?u:'https://'+u).hostname.replace(/^www\./,'').split('.')[0];}catch(e){}
  const nm={x:'X',twitter:'X',instagram:'Instagram',pixiv:'pixiv',posty:'포스타입',postype:'포스타입',github:'GitHub',youtube:'YouTube',bsky:'Bluesky',discord:'Discord',cafe:'카페',blog:'블로그',loverme:'러버미',tistory:'티스토리'}; return nm[a]||a; }
function addLinkRow(label,url){ const d=document.createElement('div'); d.className='row lrow'; d.style.marginTop='5px'; d.style.flexWrap='nowrap';

async function saveSetup(){

  if(!cfg.owner||!cfg.repo||!cfg.token)return toast('빈 칸이 있어요');
  toast('확인 중…',9000);
  const r=await gh(`/repos/${cfg.owner}/${cfg.repo}`);
  if(!r.ok){return toast('연결 실패: 아이디/저장소/토큰 확인');}
  const nk=$('#c_key').value.trim(); if(nk){ data.site.adminKey=await sha(nk); setDirty(true); toast('비밀 키 저장 — 사이트 반영 눌러야 적용돼요',3500); }

function gh(path,opt={}){ return fetch('https://api.github.com'+path,{...opt,headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json','Content-Type':'application/json',...(opt.headers||{})}}); }
async function getSha(path){ const r=await gh(`/repos/${cfg.owner}/${cfg.repo}/contents/${path}?ref=${cfg.branch}&t=${Date.now()}`); if(!r.ok)return null; return (await r.json()).sha; }
async function putFile(path,b64,msg){
  const sha=await getSha(path);
  const r=await gh(`/repos/${cfg.owner}/${cfg.repo}/contents/${path}`,{method:'PUT',body:JSON.stringify({message:msg,content:b64,branch:cfg.branch,...(sha?{sha}:{})})});
  return r.ok;
}
function blobToB64(b){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.readAsDataURL(b);});}
async function uploadFile(blob,path){
  if(!cfg?.token){ return 'data:'+blob.type+';base64,'+await blobToB64(blob); }
  const ok=await putFile(path,await blobToB64(blob),'upload '+path);
  if(!ok){toast('업로드 실패');return null;}
  // 방금 올린 건 Pages 반영 전이라 raw 주소로 미리 보여주고, 저장 경로는 상대경로로
  const raw=`https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${cfg.branch}/${path}`;
  pendingRaw[path]=raw; return path;
}
const pendingRaw={};

  if(s.welcome?.img?.startsWith('data:')){const b=await (await fetch(s.welcome.img)).blob();const path='assets/welcome-'+uid()+'.'+(b.type.includes('gif')?'gif':'png');if(!await putFile(path,await blobToB64(b),'upload '+path))return false;s.welcome.img=path;pendingRaw[path]=`https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${cfg.branch}/${path}`;}

  for(const x of (data.pairs||[])){ for(const k of ['imgA','imgB']){ if(x[k]?.startsWith('data:')){const b=await (await fetch(x[k])).blob();const path='images/'+uid()+'.'+(b.type.includes('gif')?'gif':b.type.includes('jpeg')?'jpg':'png');if(!await putFile(path,await blobToB64(b),'upload '+path))return false;x[k]=path;pendingRaw[path]=`https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${cfg.branch}/${path}`;} }
    for(let i=0;i<(x.photos||[]).length;i++){ const u=x.photos[i]; if(!u.startsWith('data:'))continue; const b=await (await fetch(u)).blob(); const path='images/'+uid()+'.'+(b.type.includes('gif')?'gif':b.type.includes('jpeg')?'jpg':'png'); if(!await putFile(path,await blobToB64(b),'upload '+path))return false; x.photos[i]=path; pendingRaw[path]=`https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${cfg.branch}/${path}`; } }

    const b=await (await fetch(u)).blob(); const path='images/'+uid()+'.'+(b.type.includes('gif')?'gif':b.type.includes('jpeg')?'jpg':'png'); if(!await putFile(path,await blobToB64(b),'upload '+path))return false; p.images[i]=path; pendingRaw[path]=`https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${cfg.branch}/${path}`; } }

}
// 상대경로 이미지가 아직 배포 전이면 raw로 대체
new MutationObserver(()=>{document.querySelectorAll('img').forEach(im=>{const s=im.getAttribute('src');if(s&&pendingRaw[s]&&!im.dataset.fb){im.dataset.fb=1;im.onerror=()=>{im.src=pendingRaw[s];};}});}).observe(document.body,{childList:true,subtree:true});

async function publish(auto){
  if(!cfg?.token)return openSetup();
  const ver=editVer;
  $('#saveBtn').disabled=true; if(!auto)toast('사이트에 반영 중…',20000);
  const ok0=await migrateDataUrls(); if(!ok0){$('#saveBtn').disabled=false;return toast('사진 업로드 실패',4000);}
  data.savedAt=Date.now();
  const b64=btoa(unescape(encodeURIComponent(JSON.stringify(data,null,1))));
  const ok=await putFile('data.json',b64,'update data '+new Date().toLocaleString('ko'));
  $('#saveBtn').disabled=false;
  if(ok){ if(ver===editVer){await idb.del('draft');dirty=false;$('#dirty').textContent='사이트 반영됨 ✧';} toast('사이트에 올라갔어요 ✧ 1분 안에 모두에게 보여요',2500);}
  else { $('#dirty').textContent='올리기 실패 — 다시 시도'; toast('올리기 실패. 연결 설정을 확인해 주세요',4000); }
}

async function replaceSite(f){
  if(!f)return; if(!cfg?.token)return openSetup();
  const t=await f.text(); if(!t.includes('<html')||!t.includes('prompt archive'))return toast('이 사이트 파일이 아닌 것 같아요',3000);
  if(!confirm('사이트 생김새·기능을 이 파일로 바꿀까요? (넣어둔 내용은 그대로예요)'))return;
  toast('사이트 파일 올리는 중…',20000);
  const ok=await putFile('index.html',btoa(unescape(encodeURIComponent(t))),'update site file');
  toast(ok?'바뀌었어요 ✧ 1~2분 뒤 새로고침하면 새 버전이에요':'올리기 실패. 연결 설정을 확인해 주세요',4000);
}

/* ---------- json backup ---------- */
function exportJson(){
  const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='prompt-archive-'+new Date().toISOString().slice(0,10)+'.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast('JSON 저장됨 ✧');
}
async function importJson(f){
  if(!f)return;
  try{ const d=JSON.parse(await f.text()); if(!d.site||!d.prompts)throw 0;
    if(!confirm('현재 내용을 이 파일로 바꿀까요?'))return;
    const keepKey=data.site?.adminKey; data=Object.assign(structuredClone(DEFAULT),d); if(keepKey&&!data.site.adminKey)data.site.adminKey=keepKey; // 비밀 키는 유지 data.personas=data.personas||[]; data.pairs=data.pairs||[]; data.pfolders=data.pfolders?.length?data.pfolders:[{id:'pf1',name:'기본'}];
    curFolder='all';curPFolder='all';curTag=null;curPersona=null; setDirty(true); applySite(); render(); toast('불러왔어요 ✧');
  }catch(e){ toast('이 사이트의 JSON 파일이 아니에요',3000); }
}

/* ---------- effects ---------- */
let fxRaf=null, parts=[];
function startFx(type,opt){
  cancelAnimationFrame(fxRaf); parts=[]; const c=$('#fx'),x=c.getContext('2d');
  const fit=()=>{c.width=innerWidth;c.height=innerHeight;}; fit(); onresize=fit;
  if(!type||type==='none'){x.clearRect(0,0,c.width,c.height);return;}
  const dens=(opt?.density||1); const N=Math.round((type==='sparkle'?40:type==='bubble'?28:60)*dens);
  const mk=()=>({x:Math.random()*c.width,y:type==='bubble'?c.height+20:-20,r:2+Math.random()*(type==='bubble'?14:type==='heart'?5:4),v:.3+Math.random()*(type==='bubble'?.5:1.2),w:Math.random()*Math.PI*2,a:.4+Math.random()*.6,rot:Math.random()*6,life:Math.random()});
  for(let i=0;i<N;i++){const p=mk();p.y=Math.random()*c.height;parts.push(p);}
  const draw=()=>{x.clearRect(0,0,c.width,c.height);
    for(const p of parts){ p.w+=.02;
      if(type==='sparkle'){ p.life+=.02; const s=(Math.sin(p.life*3)+1)/2; x.fillStyle=`rgba(120,175,255,${s*p.a})`; x.fillRect(p.x-2,p.y-p.r*2-1,4,p.r*4+2); x.fillRect(p.x-p.r*2-1,p.y-2,p.r*4+2,4); x.fillStyle=`rgba(255,255,255,${s*p.a})`;
        x.fillRect(p.x-1,p.y-p.r*2,2,p.r*4); x.fillRect(p.x-p.r*2,p.y-1,p.r*4,2); if(p.life>40){Object.assign(p,mk());p.y=Math.random()*c.height;} continue; }
      if(type==='bubble'){ p.y-=p.v; p.x+=Math.sin(p.w)*.4;
        const g=x.createRadialGradient(p.x-p.r*.3,p.y-p.r*.3,p.r*.1,p.x,p.y,p.r); g.addColorStop(0,'rgba(255,255,255,.8)');g.addColorStop(.5,'rgba(200,230,255,.2)');g.addColorStop(1,'rgba(120,180,255,.5)');
        x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fillStyle=g;x.fill();x.strokeStyle='rgba(110,170,255,.8)';x.lineWidth=1.5;x.stroke();
        if(p.y<-20)Object.assign(p,mk()); continue; }
      p.y+=p.v; p.x+=Math.sin(p.w)*.5;
      if(type==='snow'){ const q=Math.round(p.r); x.fillStyle=`rgba(140,190,255,${p.a*.9})`; x.fillRect(Math.round(p.x)-1,Math.round(p.y)-1,q+2,q+2); x.fillStyle=`rgba(255,255,255,${p.a})`; x.fillRect(Math.round(p.x),Math.round(p.y),q,q); }
      else if(type==='heart'){ x.fillStyle=`rgba(120,175,255,${p.a})`; x.font=`${p.r*3}px serif`; x.fillText('♥',p.x,p.y); }
      else if(type==='petal'){ x.save();x.translate(p.x,p.y);x.rotate(p.w);x.fillStyle=`rgba(160,205,255,${p.a})`;x.strokeStyle='rgba(110,170,255,.6)';x.beginPath();x.ellipse(0,0,p.r*1.6,p.r,0,0,7);x.fill();x.stroke();x.restore(); }
      if(p.y>c.height+20)Object.assign(p,mk());
    }
    fxRaf=requestAnimationFrame(draw); };
  draw();
}

// 편집 버튼: 토큰 연결된 내 브라우저 / 내 컴퓨터에서 파일로 열었을 때 / 비밀 키(#키)로 들어왔을 때만
const isLocal=location.protocol==='file:';
function canEdit(){ return !!(cfg&&cfg.token) || isLocal || keyOk; }
let keyOk=false;
async function sha(t){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
async function checkKey(){
  const h=decodeURIComponent(location.hash.slice(1)); if(!h)return;
  history.replaceState(null,'',location.pathname+location.search); // 주소창에서 키 바로 지움
  if(data.site.adminKey && await sha(h)===data.site.adminKey){ keyOk=true; }
}
function gateEdit(){ document.querySelector('.keybtn').classList.toggle('hidden',!canEdit()); if(!canEdit())document.body.classList.remove('admin'); }
document.querySelector('.keybtn').classList.add('hidden');
load().then(async()=>{ await checkKey(); gateEdit(); });
</script>
